name: Docker CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker image
        run: docker build -t multistage-website:nonroot .
